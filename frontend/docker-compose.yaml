version: '3.8'

services:

  frontend:
    build:
      context: .
      target: builder  # Используем промежуточный билдер
    environment:
      NODE_ENV: development  # Устанавливаем среду разработки
    ports:
      - "3000:3000"  # Открываем порт фронтенда
    volumes:
      - ./:/app  # Синхронизация исходников для горячей замены
    command: ["npm", "run", "dev"]

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"  # Внешний доступ к Nginx
    volumes:
      - ./dist:/usr/share/nginx/html  # Мета-данные собираются динамически
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf  # Dev-конфигурация Nginx
    depends_on:
      - frontend

volumes:
  static_data: