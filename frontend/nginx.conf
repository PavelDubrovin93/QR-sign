worker_processes auto;  # Автоматическое определение количества процессов

events {
    worker_connections 1024;  # Количество соединений на воркер
}

http {
    include mime.types;  # Типы MIME
    default_type application/octet-stream;

    sendfile on;  # Отправка файлов большими пакетами
    tcp_nopush on;  # Отключаем отправку мелких пакетов TCP
    keepalive_timeout 65;  # Таймаут HTTP Keep-alive

    gzip on;                      # Включаем компрессию Gzip
    gzip_disable "msie6";         # IE6 плохо поддерживает gzip
    gzip_min_length 1000;         # Минимальный размер сжимаемых объектов
    gzip_vary on;                 # Добавлять заголовок Vary: Accept-Encoding
    gzip_comp_level 6;            # Уровень компрессии (6 считается оптимальным)
    gzip_buffers 16 8k;           # Буфер для хранения сжатых данных
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xhtml+xml text/javascript application/vnd.ms-fontobject font/opentype application/x-font-ttf font/ttf image/svg+xml;

    server {
        listen 80;
        server_name example.com www.example.com;  # Имя сервера или домен

        root /usr/share/nginx/html;  # Папка с собранными ресурсами

        location / {
            try_files $uri $uri/ =404;  # Возвращаем файл или индекс, иначе ошибка 404
        }

        error_page 404 /404.html;  # Страница ошибки 404
        error_page 500 502 503 504 /50x.html;  # Общая страница ошибок

        access_log /var/log/nginx/access.log main;  # Лог обращений
        error_log /var/log/nginx/error.log warn;    # Лог ошибок
    }
}