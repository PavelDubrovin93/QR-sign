name: Dev deploy

on:
  push:
    branches:
      - frontend

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_KEY }}
  IMAGE_NAME: front-image
  VITE_BACKEND_URL: ${{ secrets.SERVER_IP }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build image
        run: docker build --pull --build-arg VITE_BACKEND_URL=${{ env.VITE_BACKEND_URL }} -t $DOCKERHUB_USERNAME/$IMAGE_NAME:latest .

      - name: Login to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push image
        run: |
          IMAGE_ID=$DOCKERHUB_USERNAME/$IMAGE_NAME
          echo IMAGE_ID=$IMAGE_ID
          docker push $IMAGE_ID:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            DOCKERHUB_USERNAME="${{ env.DOCKERHUB_USERNAME }}"
            DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            IMAGE_ID=$DOCKERHUB_USERNAME/$IMAGE_NAME
            (echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin)
            (docker image rm -f $IMAGE_ID:latest || true)
            docker pull $IMAGE_ID:latest
            docker run --name nginx-front -p 8080:8080 $IMAGE_ID:latest -d
            docker cp nginx-front:/usr/share/nginx/html /var/www/html
            (docker stop nginx-front || true)
            nginx -s reload