name: QR-Sigh CI/CD

on:
  push:
    branches:
      - develop

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_KEY }}
  IMAGE_NAME: taskmap_repo

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push
        run: |
          docker build -t $DOCKERHUB_USERNAME/qr-sigh_backend ./backend
          docker push $DOCKERHUB_USERNAME/qr-sigh_backend

  build-and-push-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push
        run: |
          docker build -t $DOCKERHUB_USERNAME/qr-sigh_frontend ./frontend
          docker push $DOCKERHUB_USERNAME/qr-sigh_frontend

  copy_nginx:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Copy docker-compose.yml via ssh
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "gateway/nginx.conf"
        target: "taskmap"

  deploy:
    needs:
      - build-and-push-backend
      - build-and-push-frontend
      - copy_nginx

    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.production.yaml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.production.yaml"
          target: "taskmap"
      
      - name: Execute commands on remote server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd taskmap
            
            echo "Pulling images..."
            sudo docker-compose --env-file .env -f docker-compose.production.yaml pull
            
            echo "Stopping and starting containers..."
            sudo docker-compose --env-file .env -f docker-compose.production.yaml down
            sudo docker-compose --env-file .env -f docker-compose.production.yaml up -d

            sudo docker-compose -f docker-compose.production.yaml exec backend poetry run alembic upgrade head

            echo "Restarting Nginx..."
            sudo systemctl restart nginx
            
            sudo docker image prune -f
            echo "Done!"
