name: Docker Hub CI/CD

on:
  push:
    branches: [ "backend" ]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_KEY }}
  IMAGE_NAME: taskmap_repo
  TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push
        run: |
          docker build -t $DOCKERHUB_USERNAME/$IMAGE_NAME:$TAG ./backend
          docker push $DOCKERHUB_USERNAME/$IMAGE_NAME:$TAG

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            deployer@${{ secrets.SERVER_IP }} <<'EOF'
          set -ex
          
          # Pull the latest image
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker pull $DOCKERHUB_USERNAME/$IMAGE_NAME:$TAG
          
          # Stop and remove old container
          docker stop $IMAGE_NAME || true
          docker rm $IMAGE_NAME || true
          
          # Run new container
          docker run -d \
            --name $IMAGE_NAME \
            --restart always \
            -p 8000:8000 \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            $DOCKERHUB_USERNAME/$IMAGE_NAME:$TAG
            
          # Cleanup
          docker system prune -af --filter "until=24h"
          EOF