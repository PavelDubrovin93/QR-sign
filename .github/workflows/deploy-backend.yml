name: Secure Deploy Backend

on:
  push:
    branches: [ "backend" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_COMPOSE_VERSION: 'v2.23.3'
      REMOTE_DIR: '~/QR-sign/backend'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >>~/.ssh/config <<END
          Host deploy-server
            HostName ${{ secrets.SERVER_IP }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          END

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-linux-x86_64" \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Sync files via rsync
        run: |
          rsync -avz -e "ssh -F ~/.ssh/config" \
            --delete \
            --exclude='.git' \
            ./backend/ \
            deploy-server:${{ env.REMOTE_DIR }}/

      - name: Deploy on server
        run: |
          ssh -F ~/.ssh/config deploy-server <<EOF
          set -e
          
          # Install Docker
          sudo apt-get update
          sudo apt-get install -y docker.io
          sudo systemctl enable --now docker
          
          # Prepare environment
          cd ${{ env.REMOTE_DIR }}
          
          # Run containers
          docker-compose -f docker-compose.prod.yaml down
          docker-compose -f docker-compose.prod.yaml up -d --build
          
          # Cleanup
          docker system prune -af --filter "until=24h"
          EOF