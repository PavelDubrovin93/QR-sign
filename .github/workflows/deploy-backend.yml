name: Deploy Backend

on:
  push:
    branches: [ "backend" ]
  pull_request:
    branches: [ "backend" ]

env:
  DOCKER_COMPOSE_VERSION: 'v2.23.3'
  SSH_PORT: 22
  REMOTE_DIR: ~/QR-sign/backend
  COMPOSE_FILE: backend/docker-compose.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          curl -fsSL https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-linux-x86_64 -o docker-compose
          chmod +x docker-compose
          sudo mv docker-compose /usr/local/bin/

      - name: Build Docker images
        env:
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          docker-compose -f ${{ env.COMPOSE_FILE }} build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            cd ${{ env.REMOTE_DIR }}
            # Создаем .env файл на сервере из secrets
            cat <<EOF > .env
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            DATABASE_PORT=${{ secrets.DATABASE_PORT }}
            EOF
            # Запускаем контейнеры
            docker-compose -f ${{ env.COMPOSE_FILE }} pull
            docker-compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans