name: Secure Deploy Backend

on:
  push:
    branches: [ "backend" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_COMPOSE_VERSION: 'v2.23.3'
      REMOTE_DIR: '/home/backend_holder/QR-sign/backend'  # Путь для нового пользователя

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: backend

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Create and setup user on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            root@${{ secrets.SERVER_IP }} <<'EOF'
          set -ex

          # Создаем пользователя
          useradd -m -s /bin/bash backend_holder
          usermod -aG docker backend_holder

          # Создаем директории
          mkdir -p /home/backend_holder/QR-sign
          chown -R backend_holder:backend_holder /home/backend_holder/QR-sign

          # Настраиваем SSH доступ
          mkdir -p /home/backend_holder/.ssh
          echo "$(cat /root/.ssh/authorized_keys)" >> /home/backend_holder/.ssh/authorized_keys
          chown -R backend_holder:backend_holder /home/backend_holder/.ssh
          chmod 700 /home/backend_holder/.ssh
          chmod 600 /home/backend_holder/.ssh/authorized_keys

          # Настраиваем sudo без пароля
          echo "backend_holder ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/backend_holder
          EOF

      - name: Sync files
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --rsync-path="sudo -u backend_holder rsync" \
            --delete \
            --exclude='.git' \
            ./ \
            backend_holder@${{ secrets.SERVER_IP }}:${{ env.REMOTE_DIR }}/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            backend_holder@${{ secrets.SERVER_IP }} <<'EOF'
          set -ex

          # Установка Docker (если нужно)
          if ! command -v docker &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y docker.io
            sudo systemctl enable --now docker
          fi

          # Установка Docker Compose
          sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

          # Запуск контейнеров
          cd ${{ env.REMOTE_DIR }}
          sudo docker-compose -f docker-compose.prod.yaml down
          sudo docker-compose -f docker-compose.prod.yaml up -d --build

          # Очистка
          sudo docker system prune -af --filter "until=24h"
          EOF