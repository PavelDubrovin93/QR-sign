name: Secure Deploy Backend

on:
  push:
    branches: ["backend"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_COMPOSE_VERSION: 'v2.23.3'
      REMOTE_DIR: '/backend_holder/QR-sign/backend'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Image
        uses: docker-compose build ./backend/ -t russuran/taskmap_repo:latest

      - name: Push Image
        run: |
          docker login -u russuran -p ${{ secrets.DOCKERHUB_KEY }}
          docker push russuran/taskmap_repo:latest
      