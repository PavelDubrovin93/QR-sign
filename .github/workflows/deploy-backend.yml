name: Secure Deploy Backend

on:
  push:
    branches: [ "backend" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_COMPOSE_VERSION: 'v2.23.3'
      COMPOSE_FILE: backend/docker-compose.prod.yaml
      REMOTE_DIR: ~/QR-sign/backend  # Путь на сервере

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Docker Compose (locally)
        run: |
          curl -fsSL https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-linux-x86_64 -o docker-compose
          chmod +x docker-compose
          sudo mv docker-compose /usr/local/bin/

      - name: Build with environment variables
        env:
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          docker-compose -f ${{ env.COMPOSE_FILE }} build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Установка Docker
            sudo apt-get update
            sudo apt-get install -y docker.io
            sudo systemctl enable --now docker

            # 2. Установка Docker Compose
            sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" \
              -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose

            # 3. Подготовка директории (с правильными правами)
            REMOTE_DIR="${{ env.REMOTE_DIR }}"
            sudo mkdir -p "$REMOTE_DIR"
            sudo chown -R $USER:$USER "$REMOTE_DIR"
            sudo chmod -R 775 "$REMOTE_DIR"

            # 4. Копирование файлов через tar+ssh (самый надежный способ)
            echo "Копирование файлов проекта..."
            tar -czf - -C $GITHUB_WORKSPACE/backend . | \
            ssh -o StrictHostKeyChecking=no -i ${{ secrets.SSH_PRIVATE_KEY }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "tar -xzf - -C $REMOTE_DIR"

            # 5. Запуск контейнеров
            cd "$REMOTE_DIR"
            docker-compose -f docker-compose.prod.yaml down
            docker-compose -f docker-compose.prod.yaml up -d --build
      - name: Verify files
        run: |
          echo "Содержимое backend/:"
          ls -la backend/
          echo "Проверка docker-compose.prod.yaml:"
          cat backend/docker-compose.prod.yaml