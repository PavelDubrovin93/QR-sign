name: Secure Deploy Backend

on:
  push:
    branches: ["backend"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_COMPOSE_VERSION: 'v2.23.3'
      REMOTE_DIR: '/root/QR-sign/backend'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Image
        run: |
          docker-compose -f ./backend/docker-compose.yml build
          docker tag russuran/taskmap_repo:latest

      - name: Push Image
        run: |
          echo "${{ secrets.DOCKERHUB_KEY }}" | docker login -u russuran --password-stdin
          docker push russuran/taskmap_repo:latest
