name: Secure Deploy Backend

on:
  push:
    branches: ["backend"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_COMPOSE_VERSION: 'v2.23.3'
      REMOTE_DIR: '/root/QR-sign/backend'  # Путь для root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions
          # Убедитесь, что ключ в правильном формате
          sed -i 's/\\n/\n/g' ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Test SSH as Root
        run: |
          ssh -i ~/.ssh/github_actions \
            -o StrictHostKeyChecking=no \
            root@${{ secrets.SERVER_IP }} \
            "echo 'Successfully connected as root!'"

      - name: Sync files as Root
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=no" \
            --rsync-path="sudo rsync" \
            --delete \
            ./backend/ \
            root@${{ secrets.SERVER_IP }}:${{ env.REMOTE_DIR }}/

      - name: Deploy on Server
        run: |
          ssh -i ~/.ssh/github_actions \
            -o StrictHostKeyChecking=no \
            root@${{ secrets.SERVER_IP }} <<'EOF'
          set -ex

          # Установка Docker
          apt-get update
          apt-get install -y docker.io
          systemctl enable --now docker

          # Установка Docker Compose
          curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose

          # Запуск контейнеров
          cd ${{ env.REMOTE_DIR }}
          docker-compose -f docker-compose.prod.yaml down
          docker-compose -f docker-compose.prod.yaml up -d --build

          # Очистка
          docker system prune -af --filter "until=24h"
          EOF