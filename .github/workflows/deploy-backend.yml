name: Deploy Backend

on:
  push:
    branches: [ "backend" ]
  pull_request:
    branches: [ "backend" ]

env:
  DOCKER_COMPOSE_VERSION: 'v2.23.3'
  SSH_PORT: 22
  REMOTE_DIR: ~/QR-sign/backend
  COMPOSE_FILE: backend/docker-compose.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "DATABASE_USER=postgres" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=postgres" >> $GITHUB_ENV
          echo "DATABASE_NAME=datadb" >> $GITHUB_ENV
          echo "DATABASE_HOST=db" >> $GITHUB_ENV
          echo "DATABASE_PORT=5432" >> $GITHUB_ENV

      - name: Install Docker Compose
        run: |
          curl -fsSL https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-linux-x86_64 -o docker-compose
          chmod +x docker-compose
          sudo mv docker-compose /usr/local/bin/

      - name: Build and deploy
        env:
          DATABASE_USER: ${{ env.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ env.DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ env.DATABASE_NAME }}
          DATABASE_HOST: ${{ env.DATABASE_HOST }}
          DATABASE_PORT: ${{ env.DATABASE_PORT }}
        run: |
          docker-compose -f ${{ env.COMPOSE_FILE }} build
          docker-compose -f ${{ env.COMPOSE_FILE }} up -d

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            cd ${{ env.REMOTE_DIR }}
            echo "DATABASE_USER=${{ env.DATABASE_USER }}" > .env
            echo "DATABASE_PASSWORD=${{ env.DATABASE_PASSWORD }}" >> .env
            echo "DATABASE_NAME=${{ env.DATABASE_NAME }}" >> .env
            echo "DATABASE_HOST=${{ env.DATABASE_HOST }}" >> .env
            echo "DATABASE_PORT=${{ env.DATABASE_PORT }}" >> .env
            docker-compose -f docker-compose.yaml pull
            docker-compose -f docker-compose.yaml up -d --remove-orphans