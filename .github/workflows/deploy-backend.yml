name: Docker Hub CI/CD

on:
  push:
    branches: [ "backend" ]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_KEY }}
  IMAGE_NAME: taskmap_repo
  TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push
        run: |
          docker build -t $DOCKERHUB_USERNAME/$IMAGE_NAME:$TAG ./backend
          docker push $DOCKERHUB_USERNAME/$IMAGE_NAME:$TAG

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
       - name: Checkout code
         run: |
          echo "Server IP: ${{ secrets.SERVER_IP }}"
          echo "User: ${{ secrets.USER }}"

       - name: Copy docker-compose.yml via ssh
         uses: appleboy/scp-action@master
         with:
           host: ${{ secrets.SERVER_IP }}
           username: ${{ secrets.USER }}
           key: ${{ secrets.SSH_PRIVATE_KEY }}
           passphrase: ${{ secrets.SSH_PASSPHRASE }}
           source: "./backend/docker-compose.prod.yml"
           target: "taskmap/backend/docker-compose.prod.yml"
