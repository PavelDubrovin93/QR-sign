version: '3.8'

volumes:
  postgres_data:
  static:
services:
  db:
    image: postgres:16
    container_name: rayz_database
    env_file: .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKERHUB_USERNAME}/qr-sigh_backend:latest
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db
    volumes:
      - static:/static

  frontend:
    image: ${DOCKERHUB_USERNAME}/qr-sigh_frontend:latest
    command: npx -y http-server -p 3000 /app/build
    volumes:
      - static:/static
    depends_on:
      - backend
    ports:
      - "3000:3000"

  gateway:
    image: ${DOCKERHUB_USERNAME}/qr-sigh_gateway:latest
    env_file: .env
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - static:/static